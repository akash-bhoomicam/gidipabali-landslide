<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gidipabali Damage | BhoomiCam</title>
<meta name="description" content="Satellite damage assessment of the Gidipabali landslide, Ganjam, Odisha, by BhoomiCam.">
<link rel="icon" href="img/Bhoomicam_Logo_Green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Views">
    <a class="logo" href="https://www.bhoomicam.com" aria-label="BhoomiCam website"><img src="img/Bhoomicam_Logo_White.png" alt="BhoomiCam"></a>
    <div class="railbtns" id="rail"></div>
  </nav>
  <aside class="panel" aria-label="Details"><div id="panel" class="panelbody"></div></aside>
  <main class="stage" id="stage">
    <div id="mapA" class="map"></div>
    <div id="mapB" class="map clip" hidden></div>
    <div class="imagebar" id="imagebar" role="group" aria-label="Image on the map"></div>
    <div class="toast" id="toast" aria-live="polite" hidden></div>
    <div class="mapkey" id="mapkey" hidden></div>
    <div class="loading" id="loading" hidden><span class="spin"></span><span id="loadingText">Loading image</span></div>
    <div class="coord" id="coord" aria-hidden="true"></div>
    <div class="swipe" id="swipe" hidden>
      <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Before and after position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <span class="grip"><svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2 2 7l5 5M15 2l5 5-5 5"/></svg></span>
      </div>
      <div class="sidetag before" id="tagA"></div>
      <div class="sidetag after" id="tagB"></div>
    </div>
    <div class="matrix" id="matrix" hidden></div>
    <div class="dock" id="dock" hidden></div>
  </main>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
